services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campus-gps-db
    environment:
      POSTGRES_USER: campus_gps
      POSTGRES_PASSWORD: campus_gps_dev
      POSTGRES_DB: campus_gps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
