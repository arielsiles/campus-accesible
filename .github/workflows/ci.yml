# FR-009: CI Pipeline — lint, typecheck, test on every PR
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: campus_gps
          POSTGRES_PASSWORD: campus_gps_dev
          POSTGRES_DB: campus_gps
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U campus_gps"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://campus_gps:campus_gps_dev@localhost:5432/campus_gps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate

      - name: Run migrations
        run: pnpm --filter server exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter server db:seed

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test
